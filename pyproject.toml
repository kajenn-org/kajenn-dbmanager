[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kajenn-dbmanager"
version = "0.2.1"
description = "Kajenn application for database migrations, backups and restores"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "asqueel-migration[validation]>=0.3.5",
    "kajenn>=0.9.2",
    "genro-routes>=0.30.1",
    "genro-storage>=0.8.5",
]

[project.optional-dependencies]
postgresql = ["asqueel-migration[postgresql]>=0.3.5"]
queries = ["asqueel-migration[postgresql]>=0.3.5"]
ui = ["gramlot>=0.3.39", "gramlot-py-server[kajenn]>=0.3.31"]
asqueel = ["asqueel[postgresql,migration]>=0.6.3,<0.7"]
clusters = ["kubernetes>=37.0.2", "asqueel-migration[postgresql]>=0.3.5"]
docs = ["sphinx>=8.0", "sphinx-rtd-theme>=3.0", "myst-parser>=4.0", "sphinxcontrib-mermaid>=2,<3"]
dev = ["pytest>=7", "ruff", "testing.postgresql", "build"]

[project.scripts]
kajenn-dbmanager = "kajenn_dbmanager.__main__:main"

[project.urls]
Documentation = "https://kajenn-dbmanager.readthedocs.io/en/latest/"
Repository = "https://github.com/kajenn-org/kajenn-dbmanager"
Issues = "https://github.com/kajenn-org/kajenn-dbmanager/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kajenn_dbmanager"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml",
    "/.readthedocs.yaml", "/assets/branding", "/docs/conf.py", "/docs/index.rst",
    "/docs/guide", "/docs/_static",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgresql: requires a PostgreSQL server and client tools"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
